<button class="btn btn-outline-info btn-xs" type="button" data-toggle="modal" data-target="#update-status-comment-modal-{{ id }}">Upload Comment</button>

<div class="modal fade" id="update-status-comment-modal-{{ id }}" tabindex="-1" role="dialog" aria-labelledby="update-status-comment-modal-label-{{ id }}" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-info" id="update-status-comment-modal-label-{{ id }}">Upload Comment on Request</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
      </div>
      <div class="modal-body text-left">
        <textarea class="form-control" name="comment" rows="5" placeholder="Comment (optional)">{{ data|default_if_none:'' }}</textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" type="submit" data-loading-text="Uploading...">Upload</button>
      </div>
    </div>
  </div>
</div>
