<ul class="list-minus-20 font-size-xs text-left">
    {% if room.key %}
        <li>
        <span class="badge badge-primary">KEY</span>
        </li>
    {% endif %}
    {% if room.card_access %}
        <li>
        <span class="badge badge-success">CARD</span>
        </li>
    {% endif %}
    {% if room.alarm %}
        <li>
        <span class="badge badge-warning">ALARM</span>
        </li>
    {% endif %}
</ul>
