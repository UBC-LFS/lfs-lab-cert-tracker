<form method="GET">
    <div class="search-filter">
        <div class="d-flex flex-row align-items-center mb-3">
        <input type="hidden" name="page" value="1" />
            <input class="form-control" type="text" name="name" value="{{ request.GET.name }}" placeholder="Approval Group's Name" />
            <span class="mx-3 text-muted">and</span>
            <input class="form-control " type="text" name="member_first_name" value="{{ request.GET.member_first_name }}" placeholder="Member's First Name" />
            <span class="mx-3 text-muted">and</span>
            <input class="form-control " type="text" name="member_last_name" value="{{ request.GET.member_last_name }}" placeholder="Member's Last Name" />
        </div>

        <div class="mt-2">
            <button class="btn btn-primary btn-sm" type="submit">Search</button>
            <a class="btn btn-sm btn-secondary" href="{% url 'key_request:all_groups' %}">Clear</a>
        </div>
    </div>
</form>
