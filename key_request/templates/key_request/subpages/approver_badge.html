{% if label == "Group" %}
  <span class="badge badge-info">Group</span>
{% elif label == "Room Supervisor" %}
  <span class="badge badge-primary">Room <br /> Supervisor</span>
{% elif label == "Requestor's Supervisor" %}
  <span class="badge badge-warning">Requestor's <br /> Supervisor</span>
{% else %}
  <span class="badge badge-secondary">Unassigned</span>
{% endif %}
