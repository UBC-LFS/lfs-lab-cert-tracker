
<form class="d-flex" action="" method="post">
  {% csrf_token %}

  <select class="form-control-xs" name="status">
    <option value="">Select</option>
    {% for id, status in req_status_dict.items %}
      <option value="{{ id }}" {% if data.status.first.status == id %}selected{% endif %}>{{ status }}</option>
    {% endfor %}
  </select>

  <input type="hidden" name="form" value="{{ data.id }}" />
  <input type="hidden" name="room" value="{{ data.room.id }}" />
{% if data.manager %}
  <input type="hidden" name="manager_id" value="{{ data.manager.id }}" />
{% endif %}

{% if data.group %}
  <input type="hidden" name="group_id" value="{{ data.group.id }}" />
{% endif %}

  <input type="hidden" name="next" value="{{ request.get_full_path }}" />

  <input class="btn btn-{% if data.is_new %}warning{% else %}secondary{% endif %} btn-xs ml-2" type="submit" value="Update" />
</form>
