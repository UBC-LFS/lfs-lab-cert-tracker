
<form class="d-flex" action="" method="post">
  {% csrf_token %}

  <select class="form-control-xs" name="status">
    <option value="">Select</option>
    {% for id, status_str in req_status_dict.items %}
      <option value="{{ id }}" {% if status == id %}selected{% endif %}>{{ status_str }}</option>
    {% endfor %}
  </select>

  <input type="hidden" name="form" value="{{ form.id }}" />
  <input type="hidden" name="room" value="{{ form.room.id }}" />
{% if form.manager %}
  <input type="hidden" name="manager_id" value="{{ form.manager.id }}" />
{% endif %}

{% if form.group %}
  <input type="hidden" name="group_id" value="{{ form.group.id }}" />
{% endif %}

  <input type="hidden" name="next" value="{{ request.get_full_path }}" />

  <input class="btn btn-{% if form.is_new %}warning{% else %}secondary{% endif %} btn-xs ml-2" type="submit" value="Update" />
</form>
