{% load custom_tags %}

<h5 class="text-info">
    Current Users in Area
    <small class="text-secondary"> ({{ data|length }})</small>
</h5>

<div style="max-height: 400px; overflow-y: auto;">
    <table class="table table-bordered table-striped table-responsive-lg text-center table-vertical-middle">
       <thead>
       <tr>
           <td>
               Role
           </td>
           <td>
               Name
           </td>
       </tr>
       </thead>
        <tbody>
        {% for user in data %}
            <tr>
            <td>
                {% role_badge user.role %}
            </td>
                <td>
                {{ user.get_full_name }}
                </td>
            </tr>
            {% empty %}
            <tr>
            <td colspan="100%">
                No users found
            </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
<ul>

</ul>
